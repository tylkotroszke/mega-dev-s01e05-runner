name: Synthetic runtime self-test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Generic local tests
        run: npm test
      - name: Build pinned dependency-only toolchain
        run: docker build --file Dockerfile.test --tag signed-test-toolchain:local .
      - name: Execute synthetic red-green control
        run: node test/docker-smoke.mjs
